<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CareComply — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: hsl(240,6%,97%); color: hsl(220,40%,12%); }
    .card { text-align: center; padding: 48px 32px; max-width: 400px; margin: 16px; background: white; border-radius: 16px; border: 1px solid hsl(220,15%,92%); box-shadow: 0 1px 2px rgba(0,0,0,.03); }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p { color: hsl(220,10%,46%); font-size: 14px; line-height: 1.5; }
    .icon { width: 48px; height: 48px; margin: 0 auto 16px; background: hsl(220,40%,96%); border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="hsl(220,40%,30%)" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
    </div>
    <h1>You&rsquo;re offline</h1>
    <p>CareComply needs an internet connection to load your data. Please check your connection and try again.</p>
  </div>
</body>
</html>
